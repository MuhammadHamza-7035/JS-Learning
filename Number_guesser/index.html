<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number</title>
    <style>
        body { background-color: #212121; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #wrapper { background-color: #333; padding: 40px; border-radius: 10px; text-align: center; }
        .form { margin-bottom: 20px; }
        .guessField { padding: 10px; font-size: 1.2rem; border: none; border-radius: 5px; outline: none; }
        .guessSubmit { padding: 10px 20px; font-size: 1.2rem; background-color: #f6d365; color: #000; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .resultParas p { font-size: 1.2rem; }
        .button { background-color: #fff; color: #212121; padding: 10px 20px; border-radius: 5px; cursor: pointer; display: inline-block; margin-top: 20px;}
    </style>
</head>
<body>
    <div id="wrapper">
        <h1>Guess the Number</h1>
        <p>Try and guess a random number between 1 and 100.</p>
        <p>You have 10 attempts to guess the right number.</p>
        
        <form class="form">
            <label for="guessField">Guess a number</label><br><br>
            <input type="text" id="guessField" class="guessField">
            <input type="submit" id="subt" value="Submit guess" class="guessSubmit">
        </form>

        <div class="resultParas">
            <p>Previous Guesses: <span class="guesses"></span></p>
            <p>Guesses Remaining: <span class="lastResult">10</span></p>
            <p class="lowOrHi"></p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
