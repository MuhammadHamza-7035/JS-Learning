<!DOCTYPE html>
<html lang="en">
<head>
    <title>Color Changer</title>
</head>
<body>
    <h1>Color Scheme Switcher</h1>
    <span class="button" id="grey" style="background: grey; padding: 20px;">Grey</span>
    <span class="button" id="white" style="background: white; border: 1px solid black; padding: 20px;">White</span>
    <span class="button" id="blue" style="background: blue; color: white; padding: 20px;">Blue</span>
    <span class="button" id="yellow" style="background: yellow; padding: 20px;">Yellow</span>
    <script src="script.js"></script>
</body>
</html>
